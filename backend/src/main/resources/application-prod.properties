# Perfil de producción (docker-compose.prod.yml, SPRING_PROFILES_ACTIVE=prod).

# Nunca loguear SQL en producción: satura los logs y puede exponer datos
# sensibles (ej. hashes de password en updates de usuario) en texto plano.
spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.protecciones=INFO
