# Define el puerto en el que se ejecutará la aplicación, permitiendo que se configure a través de una variable de entorno (SERVER_PORT) o utilizando el valor predeterminado 8082 si no se proporciona.
server.port=${SERVER_PORT:8080}

# Perfil activo: "dev" (default, ejecución local y docker-compose.override.yml)
# o "prod" (docker-compose.prod.yml). Cada uno vive en su propio
# application-{perfil}.properties (hoy solo difieren en spring.jpa.show-sql y
# el nivel de logging).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# configuración de la conexión a la base de datos PostgreSQL
# jdbc -> Java Database Connectivity, es un API de Java para conectar con bases de datos
# 5433 -> Puerto donde se expone la BDD desde Docker.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/protecciones}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# compara el modelo de datos con la base de datos, si no coinciden lanza un error
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
# Definde timezone para evitar problemas con fechas y horas, especialmente si la aplicación se ejecuta en un entorno con una zona horaria diferente a la de la base de datos.
spring.jpa.properties.hibernate.jdbc.time_zone=${TIMEZONE:America/Argentina/Buenos_Aires}

# spring.jpa.show-sql se define por perfil (application-dev.properties /
# application-prod.properties), no acá: en prod no queremos loguear SQL.

# Activa Flyway para gestionar las migraciones de la base de datos, asegurando que el esquema de la base de datos esté actualizado con el modelo de datos definido en la aplicación.
# Entonces Spring arranca y se fija que hay una migración pendiente, entonces ejecuta el script de migración y luego arranca la aplicación normalmente.
spring.flyway.enabled=true
# Le dice a flyway dónde encontrar los scripts de migración, en este caso en la carpeta "db/migration" dentro del classpath de la aplicación. Esto es importante para que Flyway pueda aplicar las migraciones correctamente al iniciar la aplicación.
spring.flyway.locations=classpath:db/migration

# Directorio base de archivos subidos
file.upload-dir=uploads

# Origenes permitidos por CORS (separados por coma). Por defecto solo
# localhost/127.0.0.1 en cualquier puerto (dev y build dockerizado). En
# produccion, definir CORS_ALLOWED_ORIGINS con el dominio real (ej.
# https://protecciones.epec.com.ar), sino el navegador rechaza las
# respuestas del backend por politica CORS.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Cantidad de intentos fallidos de login permitidos antes de bloquear
# temporalmente (por usuario y por IP) y minutos que dura ese bloqueo.
auth.login.max-intentos=${AUTH_LOGIN_MAX_INTENTOS:5}
auth.login.bloqueo-minutos=${AUTH_LOGIN_BLOQUEO_MINUTOS:15}

# Nunca exponer stacktraces ni el mensaje de excepciones no controladas en
# la respuesta HTTP (defensa en profundidad; GlobalExceptionHandler ya las
# captura, pero esto cubre errores que ocurran fuera de su alcance).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Secreto para firmar los JWT de autenticacion y su tiempo de expiracion (ms).
# Obligatorio via variable de entorno (sin default): un secreto hardcodeado
# en el repo permitiria forjar tokens validos. La app no arranca sin esto,
# igual que con DB_PASSWORD.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Ajustes para archivos adjuntos más grandes y evitar 413 Payload Too Large
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB

# Resumen ejecutivo del dashboard y Copiloto IA, generados con la Gemini API
# (Google AI Studio, capa gratuita). Si GEMINI_API_KEY no esta seteada, esas
# funcionalidades quedan deshabilitadas (resumen=null, Copiloto responde
# "no disponible") sin bloquear el resto del sistema.
# GEMINI_API_KEY admite VARIAS claves separadas por coma (una por cuenta de
# Google AI Studio, ej. GEMINI_API_KEY=clave1,clave2,clave3): GeminiService
# rota automaticamente a la siguiente clave cuando una devuelve 429 (cuota
# diaria agotada), asi se puede repartir el uso entre varias cuentas
# gratuitas sin cambiar nada a mano.
# Conseguir una clave gratis en https://aistudio.google.com/apikey
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}