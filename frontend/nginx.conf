server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reenvía las llamadas a la API al backend (resuelto por nombre de
    # servicio de docker-compose: "backend"). Así el frontend se sirve y
    # consume la API bajo el mismo origen (mismo host:puerto que ve el
    # navegador), sin depender de CORS ni de que VITE_API_BASE_URL apunte a
    # otro puerto — funciona igual detrás del proxy TLS de producción
    # (docker/nginx/proxy.conf) que accedido directo en desarrollo.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router maneja las rutas en el navegador (SPA). Si el archivo
    # pedido no existe físicamente, servimos index.html para que React
    # Router decida qué mostrar (evita 404 al recargar rutas como /reles/5).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
