# Este archivo es la base común a dev y producción: NO publica puertos de
# backend/frontend al host (eso lo decide cada entorno) y no incluye TLS ni
# backups. Para desarrollo, "docker compose up" sin -f auto-aplica también
# docker-compose.override.yml (publica 8080/5173). Para producción, se invoca
# explícitamente junto con docker-compose.prod.yml (agrega proxy TLS + backup),
# que no incluye el override y por lo tanto no expone esos puertos directo.
services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    container_name: protecciones-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Permite que "depends_on: condition: service_healthy" (backend) espere
    # a que Postgres esté realmente listo para aceptar conexiones, no solo
    # a que el contenedor haya arrancado.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    container_name: protecciones-backend
    restart: unless-stopped
    environment:
      # Dentro de la red de Docker, Postgres se resuelve por el nombre del
      # servicio ("postgres") y su puerto interno (5432), no por localhost
      # ni por el DB_PORT expuesto al host (5433).
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # dev en local/docker-compose.override.yml, prod en docker-compose.prod.yml.
      # Controla spring.jpa.show-sql y el nivel de logging (ver application-{perfil}.properties).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Secreto de firma de los JWT de login. Obligatorio (sin default): definir
      # uno propio, largo y aleatorio, en docker/.env antes de levantar el stack.
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en docker/.env con un valor largo y aleatorio}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      # Resumen ejecutivo del dashboard con IA (opcional, capa gratuita de
      # Gemini). Sin esta variable en el .env, el backend simplemente no
      # ofrece el resumen. Clave gratis en https://aistudio.google.com/apikey
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Origenes permitidos por CORS, separados por coma. Default: solo
      # localhost/127.0.0.1 (dev y build dockerizado). Setear en docker/.env
      # con el dominio real al desplegar en un servidor de producción.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    volumes:
      # Los PDF de remitos/órdenes de provisión se guardan en uploads/ con
      # ruta relativa; sin este volumen se perderían al recrear el contenedor.
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # /actuator/health es público (ver SecurityConfig) y no da detalle
    # (show-details=never), pensado justo para este healthcheck.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ../frontend
    container_name: protecciones-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data: