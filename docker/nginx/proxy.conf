# Reverse proxy TLS de producción. Único punto de entrada expuesto al host
# (80/443 -> 8080/8443 acá adentro, ver docker-compose.prod.yml). No sabe
# nada de rutas de la API: reenvía todo a "frontend", que ya tiene su propio
# location /api/ hacia "backend" (ver frontend/nginx.conf). Así el proxy no
# duplica esa lógica de ruteo.
#
# Certificado autofirmado (red interna, sin dominio público): generarlo antes
# de levantar este servicio con docker/certs/generate-self-signed.sh (ver
# README.md, sección "Producción"). El navegador va a mostrar una advertencia
# de certificado no confiable salvo que se instale en las máquinas cliente.

server {
    listen 8080;
    server_name _;

    # Todo tráfico HTTP se redirige a HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
