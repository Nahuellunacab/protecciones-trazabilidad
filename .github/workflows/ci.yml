name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # jwt.secret no tiene default (ver application.properties): es obligatorio
      # para que arranque el contexto de Spring en tests como AuthControllerTest.
      # Este valor es solo para CI, no es un secreto real ni se usa en ningún
      # entorno desplegado.
      JWT_SECRET: solo-para-tests-de-ci-nunca-usar-en-produccion-1234567890
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dar permisos de ejecución a mvnw
        run: chmod +x mvnw

      # Los tests levantan su propio Postgres via Testcontainers
      # (ver RepositoryTestBase), por eso no hace falta declarar un
      # servicio de base aparte: ubuntu-latest ya trae Docker.
      - name: Compilar y correr tests
        run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # No bloqueante: hoy hay errores de lint preexistentes (regla
      # react-hooks/set-state-in-effect en varias páginas admin) que no
      # forman parte de este cambio. Queda visible en el log del job sin
      # romper el pipeline; sacar el continue-on-error cuando se resuelvan.
      - run: npm run lint
        continue-on-error: true

      - run: npm run test
      - run: npm run build
